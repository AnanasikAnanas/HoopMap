<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#181c21" />
    <title>HOOPMAP — нет сети</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #181c21;
        color: #f5f5f2;
      }
      main {
        width: min(100%, 430px);
        padding: 32px;
        border: 1px solid #414a54;
        border-radius: 28px;
        background: #232930;
      }
      .ball {
        width: 64px;
        height: 64px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: #f26a2e;
        font-size: 30px;
      }
      h1 {
        margin: 28px 0 10px;
        font-size: 27px;
      }
      p {
        margin: 0;
        color: #b8c1ca;
        line-height: 1.6;
      }
      a {
        width: 100%;
        min-height: 48px;
        margin-top: 26px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        background: #f26a2e;
        color: white;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="ball" aria-hidden="true">🏀</div>
      <h1>Нет подключения</h1>
      <p>
        Карта и игры загрузятся, когда появится интернет. Проверьте соединение и
        попробуйте снова.
      </p>
      <a href="/map">Повторить</a>
    </main>
  </body>
</html>
