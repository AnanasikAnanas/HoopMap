name: hoopmap
services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hoopmap}
      POSTGRES_USER: ${POSTGRES_USER:-hoopmap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hoopmap}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 5s, timeout: 5s, retries: 20 }
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hoopmap}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-now}
    volumes: [minio_data:/data]
    ports: ["9001:9001"]
    healthcheck: { test: ["CMD", "mc", "ready", "local"], interval: 5s, timeout: 5s, retries: 20 }
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-02-21T16-00-46Z
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD && mc mb --ignore-existing local/$$S3_BUCKET_NAME && mc anonymous set download local/$$S3_BUCKET_NAME"]
    env_file: .env

  backend:
    build:
      context: ./backend
      target: development
    env_file: .env
    command: ["sh", "-c", "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile -"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck: { test: ["CMD", "curl", "-f", "http://localhost:8000/health/"], interval: 10s, timeout: 5s, retries: 15 }
    restart: unless-stopped

  celery:
    build: ./backend
    command: celery -A config worker -l INFO --concurrency=2
    env_file: .env
    depends_on: { backend: { condition: service_healthy }, redis: { condition: service_healthy } }
    restart: unless-stopped

  celery-beat:
    build: ./backend
    command: celery -A config beat -l INFO
    env_file: .env
    depends_on: { backend: { condition: service_healthy }, redis: { condition: service_healthy } }
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: development
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-https://demotiles.maplibre.org/style.json}
    environment: { NODE_ENV: development }
    command: ["npm", "run", "dev", "--", "-H", "0.0.0.0"]
    depends_on: { backend: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"], interval: 10s, timeout: 5s, retries: 15 }
    restart: unless-stopped

  bot:
    build: ./bot
    env_file: .env
    depends_on: { backend: { condition: service_healthy } }
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes: [./nginx/nginx.conf:/etc/nginx/nginx.conf:ro]
    ports: ["80:80"]
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_healthy }
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health/"], interval: 10s, timeout: 5s, retries: 10 }
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
