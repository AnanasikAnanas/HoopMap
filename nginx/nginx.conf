events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_status 429;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;

    upstream backend_upstream { server backend:8000; }
    upstream frontend_upstream { server frontend:3000; }
    upstream minio_upstream { server minio:9000; }

    server {
        listen 80;
        server_name _;
        client_max_body_size 12m;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(), usb=(), browsing-topics=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location = /api/v1/auth/telegram/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header X-Powered-By;
            proxy_pass http://backend_upstream;
        }

        location = /admin/login/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://backend_upstream;
        }

        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header X-Powered-By;
            proxy_pass http://backend_upstream;
        }
        location /admin/ { proxy_set_header Host $host; proxy_pass http://backend_upstream; }
        location /health/ { proxy_set_header Host backend; proxy_pass http://backend_upstream; }
        location /static/ { proxy_pass http://backend_upstream; expires 7d; }
        location /media/ {
            proxy_pass http://minio_upstream/hoopmap-media/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
        location / { proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_pass http://frontend_upstream; }
    }
}
